name: build

# Runs the tests and the full build on every push. Two things stay local and
# out of this public repo: full_sample_dataframe.csv (the catalogue cross-check
# test skips without it -- see tests/test_pipeline.py) and the raw data/maps/
# *.dat files (the Build/Check/staleness steps below skip without them, via
# the "Check for local maps" step). Both are expected gaps here, not failures.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Test
        # `python -m pytest`, not bare `pytest` -- the `-m` flag is what adds
        # the repo root to sys.path, which is what makes `from zdiviz import
        # ...` resolve. Plain `pytest` does not add it, and fails to find the
        # package even though it imports fine everywhere else.
        run: python -m pytest -q

      - name: Check for local ZDI maps
        id: maps
        # The raw .dat files are unpublished research data (see .gitignore) and
        # never exist in a plain checkout of this repo -- so in CI, running the
        # real build is simply not possible, the same way the map-dependent
        # tests can't run either. `find` (not a glob) so this doesn't depend on
        # shell-specific nullglob behaviour.
        run: |
          if [ -n "$(find data/maps -maxdepth 1 -name '*.dat' -print -quit 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No raw ZDI maps in data/maps/ -- expected here (see README). Skipping the full build verification; docs/ is what's actually served, and it's checked into the repo directly."
          fi

      - name: Build
        if: steps.maps.outputs.found == 'true'
        run: python build.py

      - name: Check the expected outputs exist
        if: steps.maps.outputs.found == 'true'
        run: |
          set -e
          for f in docs/index.html docs/hyades.speck docs/hyades.label \
                   docs/prot.cmap docs/zdi_stars.asset docs/hyades_cloud.asset; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          count=$(ls docs/textures/*.png | wc -l)
          echo "$count textures built"
          test "$count" -gt 0

      - name: Fail if the committed docs/ is stale
        if: steps.maps.outputs.found == 'true'
        run: |
          # docs/ is committed so GitHub Pages can serve it; this check makes
          # sure it was regenerated after the last source change.
          git diff --exit-code --stat -- docs/ \
            || { echo "docs/ is out of date -- run 'python build.py' and commit"; exit 1; }
